<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; padding: 12px; background: #1e1e2e; color: #e6e6f0; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { font-size: 12px; color: #b0b0c8; margin: 0 0 10px; line-height: 1.4; }
    button { width: 100%; padding: 8px; background: #4a5cf0; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #5a6cf0; }
    .note { font-size: 11px; color: #8a8aa8; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Vids Image Queue</h1>
  <p>Open <strong>Google Vids</strong> and the floating dashboard appears on the page.</p>
  <button id="focusTab">Open Google Vids</button>
  <div class="note">The dashboard can be dragged anywhere and remembers its position.</div>
  <script src="popup.js"></script>
</body>
</html>
